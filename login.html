<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - KiddoCare</title>
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="navbar">
  <div class="logo"><img src="images/kiddocare-logo.png" alt="KiddoCare" class="logo-img"></div>
  <nav class="nav-links">
    <a href="home.html">HOME</a>
    <a href="services.html">SERVICES</a>
    <a href="home.html#about">ABOUT</a>
  </nav>
  <div class="nav-actions">
    <button class="btn-outline" disabled>Sign In</button>
    <button class="btn-solid" onclick="location.href='signup.html'">Sign Up</button>
  </div>
</header>

<div class="auth-body">
  <div class="auth-bg"></div>
  <div class="auth-overlay"></div>

  <div class="auth-card">
    <img src="images/kiddocare-logo.png" alt="KiddoCare" class="auth-logo auth-logo--lg">
    <h2>Welcome back</h2>
    <p class="auth-sub spaced">Sign in to manage your child's health records</p>
    <form onsubmit="event.preventDefault(); KiddoCareAuth.setLoggedIn(true); location.href='index_loggedin.html';">
      <div class="form-group"><label>Email:</label><input type="email" placeholder="juan@gmail.com" required></div>
      <div class="form-group password-wrap"><label>Password:</label><input type="password" id="pw" placeholder="Enter your password" required><button type="button" class="toggle-pw" onclick="togglePw('pw')">&#128065;</button></div>
      <a href="#" class="forgot-link">Forgot password?</a>
      <button type="submit" class="btn-primary">Login account</button>
    </form>
    <p class="auth-links">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>

<footer class="footer">
  <div class="footer-col">
    <h4>Contact Us</h4>
    <p>Manila, Philippines</p>
    <p>+63 912 345 6789</p>
    <p>kiddocare02@gmail.com</p>
  </div>
  <div class="footer-col footer-logo">
    <img src="images/kiddocare-logo.png" alt="KiddoCare" class="footer-logo-img">
  </div>
  <div class="footer-col">
    <h4>Navigation</h4>
    <a href="home.html">Home</a>
    <a href="services.html">Services</a>
    <a href="home.html#about">About Us</a>
  </div>
  <div class="footer-bottom"><span>&copy; KiddoCare. All rights reserved</span></div>
</footer>

<script src="auth-nav.js"></script>
<script>
function togglePw(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
